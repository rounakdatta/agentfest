name: Build and Push Image + Helm Chart

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A hosted runner has ~14 GB free, and this closure (node, go, python,
      # awscli, kubectl, texlive-free-but-still-large friends) plus the image
      # tarball will not fit alongside the preinstalled toolchains.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Same cache the dotfiles repo pushes to, so the festie closure is
      # usually already built by the time we get here.
      # Non-fatal: if CACHIX_AUTH_TOKEN isn't set on this repo we still read
      # from cache.nixos.org, which covers almost the whole closure anyway.
      - name: Set up Cachix
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: rounakdatta
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check flake
        run: nix flake check --no-build

      # There is no Dockerfile: the image is a Nix derivation whose contents
      # are dotfiles' festie home profile. This produces a docker-archive
      # tarball that `docker load` understands.
      - name: Build image
        run: |
          nix build .#image --print-build-logs
          echo "IMAGE_ARCHIVE=$(readlink -f result)" >> "$GITHUB_ENV"
          ls -lh result/ 2>/dev/null || ls -lh "$(readlink -f result)"

      # No `docker load`: loading a multi-GB archive into the daemon was the
      # single slowest CI step. skopeo reads the nix-built archive directly, so
      # we only validate it here and push straight to the registry below.
      - name: Inspect image archive
        run: |
          nix run --extra-experimental-features 'nix-command flakes' nixpkgs#skopeo -- \
            inspect docker-archive:"$IMAGE_ARCHIVE" | head -40

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Push each computed tag straight from the archive with skopeo -- no
      # docker daemon, no `docker load`. The first tag pushes all blobs; the
      # rest are server-side copies that reuse them, so the archive is read once.
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        env:
          CREDS: "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
        run: |
          sk() { nix run --extra-experimental-features 'nix-command flakes' nixpkgs#skopeo -- "$@"; }
          first=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            if [ -z "$first" ]; then
              sk copy --insecure-policy --dest-creds "$CREDS" \
                docker-archive:"$IMAGE_ARCHIVE" docker://"$tag"
              first="$tag"
            else
              sk copy --insecure-policy --src-creds "$CREDS" --dest-creds "$CREDS" \
                docker://"$first" docker://"$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push Helm chart to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # On a version tag (v1.2.3), the tag is the authoritative version.
          # On a plain main push, append +<sha> so every commit produces a
          # distinct, traceable chart version without requiring a manual bump.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Derive the chart version from the tag rather than trusting
            # Chart.yaml. The tag already drives the *image* version via
            # docker/metadata-action, so reading the chart version from a file
            # lets the two drift silently — v0.1.1 shipped image 0.1.1 while
            # republishing chart 0.1.0, and the run went green.
            VER="${GITHUB_REF#refs/tags/v}"
            helm package charts/agentfest --version "$VER" --app-version "$VER"
          else
            SHA=$(echo "${{ github.sha }}" | head -c 7)
            BASE_VER=$(grep '^version:' charts/agentfest/Chart.yaml | awk '{print $2}')
            helm package charts/agentfest --version "${BASE_VER}+${SHA}"
          fi
          helm push agentfest-*.tgz oci://ghcr.io/rounakdatta/charts
