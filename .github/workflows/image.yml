name: Build and Push Image + Helm Chart

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

# A release moves main and then tags it. Building both is the same commit
# twice, and the branch build's tags (latest / main / <sha>) are consumed by
# nobody: homelab.setup pins an exact chart version. So only tags publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This closure (node, go, python, awscli, kubectl, texlive-free-but-
      # still-large friends) plus the ~2.2 GB image tarball needs room that a
      # small runner does not have alongside the preinstalled toolchains.
      # Larger runners have plenty, and the rm costs ~90s there, so ask first.
      - name: Reclaim disk space (only when tight)
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
            df -h /
          else
            echo "skipping: ${avail}G free is enough"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Read AND write. Without CACHIX_AUTH_TOKEN this logs "Pushing is
      # disabled" and nothing is ever cached, so every run rebuilds the ~160
      # leaf derivations (fish completions, the home-manager generation,
      # veans) from source -- dotfiles' validate.yaml only `nix eval`s, so it
      # cannot populate the cache either.
      # Non-fatal by design: the token is an accelerator, never a correctness
      # input. Nix store paths are content-addressed and verified, so a run
      # without it falls back to cache.nixos.org and builds the rest.
      - name: Set up Cachix
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: rounakdatta
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check flake
        run: nix flake check --no-build

      # There is no Dockerfile: the image is a Nix derivation whose contents
      # are dotfiles' festie home profile. This produces a docker-archive
      # tarball that `docker load` understands.
      - name: Build image
        run: |
          nix build .#image --print-build-logs
          echo "IMAGE_ARCHIVE=$(readlink -f result)" >> "$GITHUB_ENV"
          ls -lh result/ 2>/dev/null || ls -lh "$(readlink -f result)"

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Push each computed tag straight from the archive with skopeo -- no
      # docker daemon, no `docker load` (loading a multi-GB archive into the
      # daemon was once the single slowest step; skopeo reads the nix-built
      # archive directly, and a successful push validates it). The first tag
      # pushes all blobs; the
      # rest are server-side copies that reuse them, so the archive is read once.
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        env:
          CREDS: "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
        run: |
          sk() { nix run --extra-experimental-features 'nix-command flakes' nixpkgs#skopeo -- "$@"; }
          first=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            if [ -z "$first" ]; then
              sk copy --insecure-policy --dest-creds "$CREDS" \
                docker-archive:"$IMAGE_ARCHIVE" docker://"$tag"
              first="$tag"
            else
              sk copy --insecure-policy --src-creds "$CREDS" --dest-creds "$CREDS" \
                docker://"$first" docker://"$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push Helm chart to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # Derive the chart version from the tag rather than trusting
          # Chart.yaml. The tag already drives the *image* version via
          # docker/metadata-action, so reading the chart version from a file
          # lets the two drift silently — v0.1.1 shipped image 0.1.1 while
          # republishing chart 0.1.0, and the run went green.
          VER="${GITHUB_REF#refs/tags/v}"
          helm package charts/agentfest --version "$VER" --app-version "$VER"
          helm push agentfest-*.tgz oci://ghcr.io/rounakdatta/charts
