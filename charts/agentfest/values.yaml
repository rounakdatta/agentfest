image:
  repository: ghcr.io/rounakdatta/agentfest
  # Pinned to the same tag as Chart.appVersion so a chart upgrade always
  # corresponds to one specific image. Override at install time if you need
  # to roll forward without bumping the chart.
  tag: "0.1.24"
  pullPolicy: IfNotPresent

# One deployment is one computer. Scaling this is meaningless: the whole
# machine — home directory, tmux sessions, Claude Code state — is a single
# ReadWriteOnce volume with a single writer.
replicaCount: 1

# Codeman ships several releases a week, and it is installed into the
# persistent volume rather than baked into the image. Bumping this value and
# restarting the pod is the entire upgrade procedure — no image rebuild.
# Claude Code is installed from npm into the persistent volume rather than
# baked in from nixpkgs. The client version gates which models it can see —
# nixpkgs' 2.1.86 predates Opus 5 and silently falls back to Opus 4.6 — and a
# read-only Nix store cannot self-update out of that.
#
# "latest" resolves against the registry on every boot, so the machine tracks
# upstream by restarting rather than by editing a pin. It still only reinstalls
# when upstream has actually moved. Set an exact version to freeze it.
claudeCode:
  version: "latest"

codeman:
  # "latest" tracks upstream on restart; an exact version freezes it. Codeman
  # ships several releases a week, so tracking is usually what you want — but
  # note a Codeman upgrade recompiles node-pty from source, which is the
  # slowest part of a boot.
  version: "latest"
  port: 3000
  # Codeman rejects unknown Host headers before any handler runs (it is a
  # DNS-rebinding guard). Tailscale's .ts.net is allowed out of the box, but a
  # Traefik ingress on a custom domain is NOT — put that hostname here or every
  # request comes back as `403 host not allowed`. Comma-separated; a leading
  # dot matches subdomains.
  allowedHosts: ""

service:
  type: ClusterIP
  port: 3000

persistence:
  # The computer itself. /home/rounak holds the workspace, ~/.claude session
  # state, ~/.npm-global (Codeman), git checkouts and build artifacts — so
  # size this for real work, not for config.
  enabled: true
  # local-path is the homelab's only storage class, and it is node-local:
  # this PVC pins the pod to whichever node first schedules it.
  storageClass: ""
  size: 200Gi
  accessMode: ReadWriteOnce
  mountPath: /home/rounak
  # Reuse a pre-existing PVC instead of letting the chart create one.
  existingClaim: ""

# Codeman launches agents with --dangerously-skip-permissions by default, so
# whoever reaches the UI controls the machine. This password is a second lock
# behind Tinyauth, not a substitute for it.
auth:
  create: true
  codemanPassword: ""
  existingSecret: ""

# Credentials the machine needs to be *itself*, mounted at runtime rather than
# baked into the image.
#
# The SSH key is not optional in practice: dotfiles' claude-skills module
# clones agent-smith during home-manager activation with no fault tolerance.
# Without a key that can read that repo, activation fails — the entrypoint
# deliberately continues so you can still reach a terminal and fix it, but the
# environment will be incomplete until you do.
# Credentials the machine needs to be *itself*, mounted at runtime rather than
# baked into the image. Two keys, both stored in Bitwarden as secure notes
# because they are multi-line armored blocks:
#
#   personal.pem  RSA private key. configs/ssh points github.com and gitlab.com
#                 at ~/.ssh/keys/personal.pem, so this is what makes git work —
#                 including claude-skills' agent-smith clone during activation.
#   private.key   PGP private key. configs/gnupg imports it during activation,
#                 which is what lets pass/gopass decrypt — and therefore what
#                 the pass-backed MCP servers depend on.
#
# The entrypoint copies both to the paths dotfiles expects; they cannot be
# mounted there directly because a Secret volume is read-only and both
# destinations need to stay writable.
ssh:
  enabled: false
  existingSecret: ""
  mountPath: /run/secrets/agentfest
  defaultMode: 256

securityContext:
  runAsUser: 1000
  runAsGroup: 100
  # Makes the PVC group-writable so the non-root user actually owns its home.
  fsGroup: 100

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 24Gi

# Agents run for hours; never let a slow shutdown truncate a long build.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []

# Appended verbatim to the container's env. Use for AWS/GCP profile hints,
# CLAUDE_REAL_BINARY overrides, or anything sourced from another Secret.
extraEnv: []
