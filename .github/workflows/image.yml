name: Build and Push Image + Helm Chart

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A hosted runner has ~14 GB free, and this closure (node, go, python,
      # awscli, kubectl, texlive-free-but-still-large friends) plus the image
      # tarball will not fit alongside the preinstalled toolchains.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Same cache the dotfiles repo pushes to, so the festie closure is
      # usually already built by the time we get here.
      # Non-fatal: if CACHIX_AUTH_TOKEN isn't set on this repo we still read
      # from cache.nixos.org, which covers almost the whole closure anyway.
      - name: Set up Cachix
        continue-on-error: true
        uses: cachix/cachix-action@v15
        with:
          name: rounakdatta
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check flake
        run: nix flake check --no-build

      # There is no Dockerfile: the image is a Nix derivation whose contents
      # are dotfiles' festie home profile. This produces a docker-archive
      # tarball that `docker load` understands.
      - name: Build image
        run: |
          nix build .#image --print-build-logs
          echo "IMAGE_ARCHIVE=$(readlink -f result)" >> "$GITHUB_ENV"
          ls -lh result/ 2>/dev/null || ls -lh "$(readlink -f result)"

      - name: Load image
        run: |
          docker load < "$IMAGE_ARCHIVE"
          docker image ls "${{ env.REGISTRY }}/${{ github.repository_owner }}/agentfest"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # The Nix build always names the image :latest, so retag it onto every
      # tag the metadata action computed and push each one.
      - name: Tag and push image
        if: github.event_name != 'pull_request'
        run: |
          SOURCE="${{ env.REGISTRY }}/${{ github.repository_owner }}/agentfest:latest"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            docker tag "$SOURCE" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push Helm chart to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # On a version tag (v1.2.3), the tag is the authoritative version.
          # On a plain main push, append +<sha> so every commit produces a
          # distinct, traceable chart version without requiring a manual bump.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Derive the chart version from the tag rather than trusting
            # Chart.yaml. The tag already drives the *image* version via
            # docker/metadata-action, so reading the chart version from a file
            # lets the two drift silently — v0.1.1 shipped image 0.1.1 while
            # republishing chart 0.1.0, and the run went green.
            VER="${GITHUB_REF#refs/tags/v}"
            helm package charts/agentfest --version "$VER" --app-version "$VER"
          else
            SHA=$(echo "${{ github.sha }}" | head -c 7)
            BASE_VER=$(grep '^version:' charts/agentfest/Chart.yaml | awk '{print $2}')
            helm package charts/agentfest --version "${BASE_VER}+${SHA}"
          fi
          helm push agentfest-*.tgz oci://ghcr.io/rounakdatta/charts
